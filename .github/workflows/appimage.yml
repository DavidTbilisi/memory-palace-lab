name: AppImage

# Builds the Linux AppImage the way the release does and starts it on the newest Fedora,
# whose Mesa is much newer than the one on the Ubuntu 22.04 build machine.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/appimage.yml"
      - ".github/workflows/release.yml"
      - "scripts/linux/**"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the AppImage
        # Without updater artifacts the build does not need the release signing key.
        run: npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Remove the display libraries
        run: |
          mkdir -p appimages/bundled appimages/unbundled
          cp src-tauri/target/release/bundle/appimage/*.AppImage appimages/bundled/
          bash scripts/linux/unbundle-display-libs.sh
          cp src-tauri/target/release/bundle/appimage/*.AppImage appimages/unbundled/

      - uses: actions/upload-artifact@v4
        with:
          name: appimages
          path: appimages
          retention-days: 3

  fedora:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: appimages
          path: appimages

      - name: Install an X server and Fedora's Mesa
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gtk3 mesa-dri-drivers mesa-libEGL mesa-libGL mesa-libgbm dejavu-sans-fonts
          /usr/bin/Xvfb /usr/bin/dbus-run-session /usr/bin/pgrep /usr/bin/setsid

      - name: Load Fedora's Mesa next to the AppImage libraries
        run: |
          for kind in bundled unbundled; do
            dir="$(mktemp -d)"
            image="$(realpath appimages/$kind/*.AppImage)"
            chmod +x "$image"
            (cd "$dir" && "$image" --appimage-extract > /dev/null)
            echo "== $kind: $(cd "$dir/squashfs-root" && find . -name 'libwayland-*' -o -name 'libxkbcommon*' -o -name 'libxcb-*' -o -name 'libXau*' -o -name 'libXdmcp*' | sort | tr '\n' ' ')"
            for lib in /usr/lib64/libEGL_mesa.so.0 /usr/lib64/libgallium-*.so; do
              echo "-- $lib, AppImage libraries first:"
              LD_LIBRARY_PATH="$dir/squashfs-root/usr/lib" ldd -r "$lib" 2>&1 | grep -E "undefined symbol|not found|squashfs-root" || echo "   everything comes from the host"
            done
          done

      - name: Start the AppImage with the bundled display libraries
        run: |
          if bash scripts/linux/smoke-appimage.sh appimages/bundled/*.AppImage; then
            echo "::warning::The AppImage with the bundled display libraries did not crash here, so this job cannot show that removing them helps."
          fi

      - name: Start the AppImage without them
        run: bash scripts/linux/smoke-appimage.sh appimages/unbundled/*.AppImage

      - name: Start the old AppImage with the host libraries preloaded
        # The workaround for AppImages released before the libraries were removed.
        run: >
          bash scripts/linux/smoke-appimage.sh appimages/bundled/*.AppImage
          LD_PRELOAD=/usr/lib64/libwayland-client.so.0:/usr/lib64/libwayland-cursor.so.0:/usr/lib64/libwayland-egl.so.1:/usr/lib64/libwayland-server.so.0:/usr/lib64/libxkbcommon.so.0:/usr/lib64/libxcb-randr.so.0:/usr/lib64/libxcb-render.so.0:/usr/lib64/libxcb-shm.so.0:/usr/lib64/libXau.so.6:/usr/lib64/libXdmcp.so.6
